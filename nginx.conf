resolver 127.0.0.11 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
resolver_timeout 5s;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_types text/css application/javascript application/json;

    # Bank of Israel representative exchange rates (same-origin, avoids CORS)
    location = /api/boi-rates {
        set $boi_host boi.org.il;
        proxy_pass https://$boi_host/PublicApi/GetExchangeRates;
        proxy_ssl_server_name on;
        proxy_ssl_name boi.org.il;
        proxy_set_header Host boi.org.il;
        proxy_set_header Accept "application/json";
        proxy_set_header User-Agent "Mozilla/5.0 (compatible; order-app)";
        proxy_set_header Cookie "";
        proxy_hide_header Set-Cookie;
        proxy_connect_timeout 8s;
        proxy_read_timeout 10s;
        add_header Cache-Control "public, max-age=600";
    }

    location = /index.html { add_header Cache-Control "no-cache"; }
    location /vendor/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
    location / { try_files $uri $uri/ /index.html; }
}
